<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#06080F">
  <title>Angel's Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overscroll-behavior:none}
    body{background:#06080F;color:#EDF0F7;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
    #app{max-width:480px;margin:0 auto;min-height:100vh}
    ::-webkit-scrollbar{width:2px}
    ::-webkit-scrollbar-thumb{background:#ffffff12;border-radius:1px}
    input[type=number]::-webkit-inner-spin-button{opacity:.4}

    .content{padding-bottom:86px}
    .pad{padding:6px 16px}
    .card{background:#0C0E1B;border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:16px;margin-bottom:12px}

    .nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(6,8,15,.97);border-top:1px solid rgba(255,255,255,.07);backdrop-filter:blur(20px);display:flex;z-index:300;padding-bottom:env(safe-area-inset-bottom,6px)}
    .nb{flex:1;padding:11px 2px 5px;border:none;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;-webkit-tap-highlight-color:transparent}
    .nb .ni{font-size:18px;line-height:1.2}
    .nb .nl{font-size:8px;font-weight:700;letter-spacing:1px;color:#374151;font-family:'DM Sans',sans-serif;text-transform:uppercase;margin-top:1px}
    .nb.on .nl{color:#F59E0B}
    .ndot{width:18px;height:2px;border-radius:1px;background:#F59E0B;margin-top:2px;box-shadow:0 0 8px rgba(245,158,11,.5)}

    .dn{display:flex;align-items:center;gap:8px;padding:14px 4px 10px}
    .dbt{width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.03);color:#6B7280;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
    .dbt.dim{color:#111320;pointer-events:none}

    .sh{font-size:9px;font-weight:700;color:#374151;letter-spacing:2px;margin-bottom:10px;padding-left:2px;padding-top:4px;font-family:'Syne',sans-serif;text-transform:uppercase}

    .hr{display:flex;align-items:center;gap:14px;padding:12px 10px;border-radius:10px;cursor:pointer;margin-bottom:2px;-webkit-tap-highlight-color:transparent}
    .hr:active{background:rgba(255,255,255,.03)}

    .sb{padding:9px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.06);cursor:pointer;font-weight:600;font-size:13px;background:rgba(255,255,255,.04);color:#6B7280;font-family:'DM Mono',monospace;-webkit-tap-highlight-color:transparent}
    .sb.on{background:rgba(15,224,170,.12);color:#0FE0AA;border-color:rgba(15,224,170,.3);box-shadow:0 0 10px rgba(15,224,170,.1)}

    .stb{width:38px;height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.04);color:#EDF0F7;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;flex-shrink:0}

    .pt{height:5px;border-radius:2.5px;background:rgba(255,255,255,.06);overflow:hidden}
    .pf{height:100%;border-radius:2.5px;background:#0FE0AA;transition:width .4s}

    .inp{width:100%;padding:11px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.04);color:#EDF0F7;font-size:13px;font-family:'DM Sans',sans-serif}
    .inp:focus{outline:none;border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.03)}
    select.inp option{background:#0C0E1B}
    textarea.inp{resize:none;line-height:1.65;color:#6B7280}

    .bgold{background:#F59E0B;color:#000;border:none;border-radius:12px;padding:13px;font-weight:700;font-size:13px;cursor:pointer;width:100%;font-family:'DM Sans',sans-serif;letter-spacing:.3px;-webkit-tap-highlight-color:transparent;box-shadow:0 4px 16px rgba(245,158,11,.2)}
    .boutl{background:transparent;color:#F59E0B;border:1px solid rgba(245,158,11,.2);border-radius:10px;padding:10px 18px;font-weight:600;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;-webkit-tap-highlight-color:transparent}
    .pill{display:inline-flex;align-items:center;padding:7px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.07);background:transparent;color:#6B7280;font-size:11px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;-webkit-tap-highlight-color:transparent;letter-spacing:.3px}
    .pill.on{background:#F59E0B;color:#000;border-color:#F59E0B}
    .catb{background:#0C0E1B;border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;border:1.5px solid rgba(255,255,255,.06);-webkit-tap-highlight-color:transparent}
    .catb.on{background:#0D1020;border-color:rgba(245,158,11,.3)}
    .xcbtn{background:none;border:none;cursor:pointer;color:rgba(255,255,255,.1);font-size:14px;padding:3px 5px;-webkit-tap-highlight-color:transparent}

    .ti{display:flex;align-items:flex-start;gap:10px;padding:13px 14px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.05);border-radius:12px;margin-bottom:6px}
    .badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;margin-top:5px;letter-spacing:.5px}
    .divl{height:1px;background:rgba(255,255,255,.05);flex:1}
    .fe{display:flex;align-items:center;gap:10px;padding:11px 12px}

    button:active{opacity:.72;transform:scale(.95)}
    [onclick]:active{opacity:.8}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>

// ─── HELPERS ───────────────────────────────────────────────────────
function dk(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function labelDate(d){
  const t=todayD(),yt=new Date(t);yt.setDate(t.getDate()-1);
  const k=dk(d);
  if(k===dk(t))return'Today';
  if(k===dk(yt))return'Yesterday';
  return d.toLocaleDateString('en-NG',{weekday:'short',month:'short',day:'numeric'});
}
function fullDate(d){return d.toLocaleDateString('en-NG',{weekday:'long',month:'long',day:'numeric',year:'numeric'});}
function emptyDay(){return{habits:{},hygiene:{},sleep:null,readMins:0,notes:'',wxChecks:{}};}
function getDay(d){return S.dayDB[dk(d)]||emptyDay();}
function getFood(d){return S.foodDB[dk(d)]||{entries:[]};}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function weekData(){
  const t=todayD();
  return Array.from({length:7},(_,i)=>{
    const d=new Date(t);d.setDate(t.getDate()-6+i);
    const dd=getDay(d);
    const done=ALL_H.filter(h=>(dd.habits[h.id]||dd.hygiene[h.id])).length;
    return{date:d,pct:ALL_H.length?Math.round((done/ALL_H.length)*100):0,lbl:d.toLocaleDateString('en-NG',{weekday:'short'}).charAt(0)};
  });
}

// ─── SCAN ACTIONS ──────────────────────────────────────────────────
function openScan(){S.scanOpen=true;S.scanImg=null;S.scanB64=null;S.scanResult=null;S.scanError=null;S.scanLoading=false;render();}
function closeScan(){S.scanOpen=false;stopScanCam();render();}
function onScanFile(input){
  const file=input.files[0];if(!file)return;
  stopScanCam();
  const r=new FileReader();
  r.onload=e=>{S.scanImg=e.target.result;S.scanB64=e.target.result.split(',')[1];S.scanResult=null;S.scanError=null;render();};
  r.readAsDataURL(file);
}
let _scanStream=null;
function startScanCam(){
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(st=>{
    _scanStream=st;
    render();
    setTimeout(()=>{const v=document.getElementById('scan-video');if(v){v.srcObject=st;}},50);
  }).catch(()=>{S.scanError='Camera denied. Use file upload instead.';render();});
}
function stopScanCam(){if(_scanStream){_scanStream.getTracks().forEach(t=>t.stop());_scanStream=null;}}
function snapScanCam(){
  const v=document.getElementById('scan-video');if(!v)return;
  const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;
  c.getContext('2d').drawImage(v,0,0);
  const d=c.toDataURL('image/jpeg',0.85);
  S.scanImg=d;S.scanB64=d.split(',')[1];S.scanResult=null;S.scanError=null;
  stopScanCam();render();
}
async function runScan(){
  if(!S.scanB64)return;
  S.scanLoading=true;S.scanError=null;S.scanResult=null;render();
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:[
        {type:'image',source:{type:'base64',media_type:'image/jpeg',data:S.scanB64}},
        {type:'text',text:`You are a nutrition expert. Analyse this food image and return ONLY a valid JSON object (no markdown, no backticks, no extra text) with this exact structure:
{"total_calories":<number>,"items":[{"name":"<food name>","portion":"<estimated portion>","calories":<number>,"protein":<number>,"carbs":<number>,"fat":<number>}],"notes":"<1-2 sentence tip or confidence note>"}
Be realistic. If image is not food, set total_calories to 0 and explain in notes.`}
      ]}]})});
    const data=await res.json();
    const raw=data.content.map(b=>b.text||'').join('');
    const clean=raw.replace(/```json|```/g,'').trim();
    S.scanResult=JSON.parse(clean);
  }catch(e){S.scanError='Could not analyse image. Try a clearer photo.';}
  S.scanLoading=false;render();
}
function addScanItems(){
  if(!S.scanResult||!S.scanResult.items)return;
  const k=dk(S.selDate);if(!S.foodDB[k])S.foodDB[k]={entries:[]};
  S.scanResult.items.forEach(item=>{
    S.foodDB[k].entries.push({
      id:Date.now()+Math.random(),
      name:item.name+' 📷',
      unit:item.portion,qty:1,
      cal:item.calories||0,p:item.protein||0,c:item.carbs||0,f:item.fat||0
    });
  });
  save();
  S.scanOpen=false;S.scanImg=null;S.scanB64=null;S.scanResult=null;S.scanError=null;
  stopScanCam();render();
}

}

        </div>
        <div style="text-align:center;padding:12px 8px">
          <div style="font-family:'DM Mono',monospace;font-size:34px;font-weight:500;color:#C084FC;line-height:1">${Math.round(tF)}<span style="font-size:16px">g</span></div>
          <div style="font-size:8px;font-weight:700;color:#374151;letter-spacing:1.5px;margin-top:6px;font-family:'Syne',sans-serif">FAT</div>
        </div>
      </div>
      <div class="pt" style="margin-bottom:8px"><div class="pf" style="width:${pct}%;background:${calColor}"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:#374151">
        <span style="font-family:'DM Mono',monospace">${Math.round(tC)} / ${CAL_GOAL} kcal</span>
        <span style="color:${over?'#EF4444':'#374151'};font-weight:${over?600:400}">${over?'⚠️ +'+Math.round(tC-CAL_GOAL)+' over':CAL_GOAL-Math.round(tC)+' remaining'}</span>
      </div>
    </div>

    <div class="card" style="padding:16px;margin-bottom:12px">
      <div class="sh">Log Food</div>
      <select id="food-sel" class="inp" onchange="setSelFood(this.value)" style="margin-bottom:14px">
        ${FOODS.map(f=>`<option value="${f.id}"${f.id===S.selFood?' selected':''}>${esc(f.name)} (${f.cal} kcal / ${f.unit})</option>`).join('')}
      </select>
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
        <span style="font-size:12px;color:#4B5568;font-weight:600;width:24px">Qty</span>
        <button class="stb" onclick="adjQty(-0.5)">−</button>
        <span style="font-family:'DM Mono',monospace;font-size:26px;font-weight:500;min-width:32px;text-align:center;color:#EDF0F7">${S.foodQty}</span>
        <button class="stb" onclick="adjQty(0.5)">+</button>
        <span style="font-size:12px;color:#4B5568">${esc(fd.unit)}</span>
      </div>
      <div style="font-size:12px;color:#4B5568;margin-bottom:14px;font-family:'DM Mono',monospace">≈ ${pCal} kcal · ${pPro}g protein</div>
      <button class="bgold" onclick="addFood()">+ Add to Log</button>
    </div>

    ${bScanCard()}

    <div class="card" style="padding:16px;margin-bottom:12px">
      <div class="sh">Add Other Food</div>
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <input id="cst-n" class="inp" style="flex:2" placeholder="Food name" value="${esc(S.cstName)}" oninput="updCN(this.value)">
        <input id="cst-c" type="number" class="inp" style="flex:1;text-align:center" placeholder="kcal" value="${esc(S.cstCal)}" oninput="updCC(this.value)">
      </div>
      <button class="boutl" onclick="addCst()">+ Add Custom</button>
    </div>

    <div class="sh">Food Log</div>
    ${en.length===0?`<div style="text-align:center;padding:28px 20px;color:#374151;font-size:13px">Nothing logged yet 🥗</div>`:
    `<div class="card" style="padding:8px;margin-bottom:16px">
      ${en.map((e,i)=>`
        <div class="fe" style="border-bottom:${i<en.length-1?'1px solid rgba(255,255,255,.04)':'none'}">
          <div style="flex:1">
            <div style="font-size:13px;font-weight:600;color:#EDF0F7">${esc(e.name)}${e.qty!==1?` ×${e.qty}`:''}</div>
            <div style="font-size:11px;color:#4B5568;margin-top:2px;font-family:'DM Mono',monospace">${e.cal} kcal · ${e.p}g P</div>
          </div>
          <button class="xcbtn" onclick="delFood(${e.id})">✕</button>
        </div>`).join('')}
    </div>`}
  </div>`;
}

// ─── TASKS ─────────────────────────────────────────────────────────
function bTasks(){
  const filt=S.tasks.filter(t=>{
    const cok=S.tCat==='All'||t.category===S.tCat;
    const sok=S.tStatus==='All'||(S.tStatus==='Pending'?!t.done:t.done);
    return cok&&sok;
  });
  const cm=[
    {cat:'Scholarship',key:'SCH',em:'🎓',bg:'rgba(167,139,250,.07)',txt:'#A78BFA',br:'rgba(167,139,250,.15)'},
    {cat:'CNC Machine', key:'CNC',em:'⚙️',bg:'rgba(52,211,153,.07)',txt:'#34D399',br:'rgba(52,211,153,.15)'},
    {cat:'General',     key:'GEN',em:'📌',bg:'rgba(251,191,36,.07)',txt:'#FBBF24',br:'rgba(251,191,36,.15)'},
  ];

  return`<div style="padding:12px 16px">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px">
      ${cm.map(({cat,key,em,txt})=>{
        const p=S.tasks.filter(t=>t.category===cat&&!t.done).length;
        const tot=S.tasks.filter(t=>t.category===cat).length;
        const dn=tot-p;
        const act=S.tCat===cat;
        return`<div class="catb${act?' on':''}" onclick="setTCat('${cat}')">
          <div style="font-size:20px;margin-bottom:5px">${em}</div>
          <div style="font-family:'DM Mono',monospace;font-size:28px;font-weight:500;color:${act?txt:'#EDF0F7'};line-height:1">${p}</div>
          <div style="font-size:8px;color:#374151;letter-spacing:1px;margin-top:4px;font-family:'Syne',sans-serif;font-weight:700">${key}</div>
          <div style="font-size:9px;color:#2D3748;margin-top:3px">${dn}/${tot} done</div>
        </div>`;}).join('')}
    </div>

    <div class="card" style="padding:14px;margin-bottom:12px">
      <input id="task-inp" class="inp" placeholder="New task..." value="${esc(S.newTask)}" oninput="updNT(this.value)" onkeydown="if(event.key==='Enter')addTask()">
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px">
        ${['Scholarship','CNC Machine','General'].map(cat=>`
          <button onclick="setNTC('${cat}')" style="padding:6px 12px;border-radius:20px;border:none;cursor:pointer;font-weight:600;font-size:11px;font-family:'DM Sans',sans-serif;background:${S.newTaskCat===cat?'#F59E0B':'rgba(255,255,255,.05)'};color:${S.newTaskCat===cat?'#000':'#6B7280'}">
            ${cat==='CNC Machine'?'⚙️ CNC':cat==='Scholarship'?'🎓 Sch':'📌 Gen'}
          </button>`).join('')}
        <button onclick="addTask()" style="margin-left:auto;padding:7px 18px;border-radius:20px;border:none;background:#F59E0B;color:#000;font-weight:700;font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer">+ Add</button>
      </div>
    </div>

    <div style="display:flex;gap:6px;margin-bottom:14px">
      ${['All','Pending','Done'].map(s=>`<button class="pill${S.tStatus===s?' on':''}" onclick="setTSt('${s}')">${s}</button>`).join('')}
    </div>

    ${cm.map(({cat,em,bg,txt,br})=>{
      const ct=filt.filter(t=>t.category===cat);if(!ct.length)return'';
      const tot=S.tasks.filter(t=>t.category===cat).length;
      const dn=S.tasks.filter(t=>t.category===cat&&t.done).length;
      return`<div style="margin-bottom:16px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <span style="font-size:9px;font-weight:700;color:#374151;letter-spacing:1.5px;font-family:'Syne',sans-serif;text-transform:uppercase">${em} ${cat}</span>
          <div class="divl"></div>
          <span style="font-family:'DM Mono',monospace;font-size:10px;color:#374151">${dn}/${tot}</span>
        </div>
        ${ct.map(task=>`
          <div class="ti">
            <div onclick="togTask('${task.id}')" style="width:20px;height:20px;border-radius:6px;border:2px solid ${task.done?txt:'rgba(255,255,255,.1)'};background:${task.done?txt+'15':'transparent'};flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:1px">
              ${task.done?`<span style="color:${txt};font-size:9px;font-weight:900">✓</span>`:''}
            </div>
            <div style="flex:1">
              <div style="font-size:13px;line-height:1.5;color:${task.done?'rgba(255,255,255,.18)':'#EDF0F7'};text-decoration:${task.done?'line-through':'none'}">${esc(task.title)}</div>
              <span class="badge" style="background:${bg};color:${txt};border:1px solid ${br}">${cat==='CNC Machine'?'CNC':cat==='Scholarship'?'SCH':'GEN'}</span>
            </div>
            <button class="xcbtn" onclick="delTask('${task.id}')">✕</button>
          </div>`).join('')}
      </div>`;}).join('')}
  </div>`;
}

// ─── HABIT ROW ─────────────────────────────────────────────────────
function hRow(h,done,fn){
  return`<div class="hr" onclick="${fn}">
    <div style="width:22px;height:22px;border-radius:7px;border:2px solid ${done?'#0FE0AA':'rgba(255,255,255,.1)'};background:${done?'rgba(15,224,170,.12)':'transparent'};flex-shrink:0;display:flex;align-items:center;justify-content:center">
      ${done?'<span style="color:#0FE0AA;font-size:11px;font-weight:900">✓</span>':''}
    </div>
    <span style="font-size:18px">${h.emoji}</span>
    <span style="font-size:14px;font-weight:500;color:${done?'rgba(255,255,255,.25)':'#EDF0F7'};text-decoration:${done?'line-through':'none'}">${h.label}</span>
  </div>`;
}

// ─── INIT ──────────────────────────────────────────────────────────
load();
render();

// ─── COPY PROGRESS SUMMARY ─────────────────────────────────────────
function copyProgress(){
  const today=todayD();
  const dd=getDay(today);
  const fd=getFood(today);
  const dateStr=today.toLocaleDateString('en-NG',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  const spiritDone=SPIRIT.filter(h=>dd.habits[h.id]);
  const spiritPend=SPIRIT.filter(h=>!dd.habits[h.id]);
  const hygDone=HYGIENE.filter(h=>dd.hygiene[h.id]);
  const hygPend=HYGIENE.filter(h=>!dd.hygiene[h.id]);
  const totalDone=spiritDone.length+hygDone.length;
  const totalH=ALL_H.length;
  const habitPct=totalH?Math.round((totalDone/totalH)*100):0;
  const wx=WX[today.getDay()];
  const volley=!!dd.habits['volleyball'];
  const exDone=wx.exs.filter(ex=>(dd.wxChecks||{})[ex]);
  const exPend=wx.exs.filter(ex=>!(dd.wxChecks||{})[ex]);
  const en=fd.entries||[];
  const tCal=en.reduce((s,e)=>s+e.cal,0);
  const tPro=en.reduce((s,e)=>s+e.p,0);
  const tCarb=en.reduce((s,e)=>s+e.c,0);
  const tFat=en.reduce((s,e)=>s+e.f,0);
  const schTasks=S.tasks.filter(t=>t.category==='Scholarship');
  const cncTasks=S.tasks.filter(t=>t.category==='CNC Machine');
  const genTasks=S.tasks.filter(t=>t.category==='General');
  const schDone=schTasks.filter(t=>t.done).length;
  const cncDone=cncTasks.filter(t=>t.done).length;
  const genDone=genTasks.filter(t=>t.done).length;
  const wk=weekData();
  const wkStr=wk.map(w=>{
    const lbl=w.date.toLocaleDateString('en-NG',{weekday:'short'});
    const bar=w.pct===0?'░░░░░':w.pct<40?'██░░░':w.pct<70?'███░░':w.pct<100?'████░':'█████';
    return lbl+' '+bar+' '+w.pct+'%';
  }).join('  ');
  const lines=[
    '╔═══════════════════════════════════════════════════╗',
    '║            ANGEL\'S PROGRESS SUMMARY              ║',
    '╚═══════════════════════════════════════════════════╝',
    '📅 '+dateStr,'',
    '━━━ 🌟 DAILY HABITS ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━',
    'Overall: '+totalDone+'/'+totalH+' ('+habitPct+'%)', '',
    'Spiritual:',
    spiritDone.length?'  ✅ '+spiritDone.map(h=>h.label).join(', '):'  (none done)',
    spiritPend.length?'  ⏳ '+spiritPend.map(h=>h.label).join(', '):'', '',
    'Hygiene & Self-care:',
    hygDone.length?'  ✅ '+hygDone.map(h=>h.label).join(', '):'  (none done)',
    hygPend.length?'  ⏳ '+hygPend.map(h=>h.label).join(', '):'', '',
    'Sleep: '+(dd.sleep?dd.sleep+'h last night':'Not logged'),
    'Study/Reading: '+(dd.readMins||0)+' minutes',
    dd.notes?'Notes: '+dd.notes:'', '',
    '━━━ 💪 FITNESS ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━',
    'Workout: '+wx.name+' ('+wx.sub+')',
    'Volleyball: '+(volley?'✅ Done':'⏳ Pending'),
    wx.exs.length?('Exercises ('+exDone.length+'/'+wx.exs.length+'):'+
      (exDone.length?'\n  ✅ '+exDone.join(', '):'')+
      (exPend.length?'\n  ⏳ '+exPend.join(', '):'')):'Rest day', '',
    '━━━ 🍽️ NUTRITION ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━',
    en.length?('Calories: '+Math.round(tCal)+' / '+CAL_GOAL+' kcal'+(tCal>CAL_GOAL?' (⚠️ over by '+Math.round(tCal-CAL_GOAL)+')':(CAL_GOAL-Math.round(tCal))+' remaining')+
      '\nProtein: '+Math.round(tPro)+'g  Carbs: '+Math.round(tCarb)+'g  Fat: '+Math.round(tFat)+'g'+
      '\nFoods: '+en.map(e=>e.name+(e.qty!==1?' x'+e.qty:'')+' ('+e.cal+'kcal)').join(', ')):'Nothing logged today', '',
    '━━━ ✅ TASKS ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━',
    '🎓 Scholarship: '+schDone+'/'+schTasks.length+' done',
    schTasks.filter(t=>t.done).length?'  ✅ '+schTasks.filter(t=>t.done).map(t=>t.title).join('; '):'',
    schTasks.filter(t=>!t.done).length?'  ⏳ '+schTasks.filter(t=>!t.done).map(t=>t.title).join('; '):'', '',
    '⚙️  CNC Machine: '+cncDone+'/'+cncTasks.length+' done',
    cncTasks.filter(t=>t.done).length?'  ✅ '+cncTasks.filter(t=>t.done).map(t=>t.title).join('; '):'',
    cncTasks.filter(t=>!t.done).length?'  ⏳ '+cncTasks.filter(t=>!t.done).map(t=>t.title).join('; '):'', '',
    genTasks.length?('📌 General: '+genDone+'/'+genTasks.length+' done'):'',
    genTasks.filter(t=>t.done).length?'  ✅ '+genTasks.filter(t=>t.done).map(t=>t.title).join('; '):'',
    genTasks.filter(t=>!t.done).length?'  ⏳ '+genTasks.filter(t=>!t.done).map(t=>t.title).join('; '):'', '',
    '━━━ 📊 WEEKLY HABIT STREAK ━━━━━━━━━━━━━━━━━━━━━━',
    wkStr,'',
    '═══════════════════════════════════════════════════',
  ].filter(l=>l!==undefined&&l!==null);
  const text=lines.join('\n');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{
      const btn=document.getElementById('copy-btn');
      if(btn){btn.textContent='✓ Copied!';btn.style.color='#0FE0AA';btn.style.borderColor='rgba(15,224,170,.3)';setTimeout(()=>{btn.textContent='📋 Summary';btn.style.color='#F59E0B';btn.style.borderColor='rgba(245,158,11,.2)';},2500);}
    }).catch(()=>fallbackCopy(text));
  } else { fallbackCopy(text); }
}
function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);
  const btn=document.getElementById('copy-btn');
  if(btn){btn.textContent='✓ Copied!';setTimeout(()=>{btn.textContent='📋 Summary';},2500);}
}
</script>
